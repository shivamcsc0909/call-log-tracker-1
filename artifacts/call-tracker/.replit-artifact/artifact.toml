kind = "mobile"
previewPath = "/"
title = "Call Tracker"
version = "1.0.0"
id = "artifacts/call-tracker"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 21117

[services.development]
run = "pnpm --filter @workspace/call-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/call-tracker", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/call-tracker", "run", "serve" ]

[services.env]
PORT = "21117"
BASE_PATH = "/"
